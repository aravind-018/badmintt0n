services:
  postgres:
    image: postgres:16-alpine
    container_name: badminton-live-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-badminton_live}
      POSTGRES_USER: ${POSTGRES_USER:-badminton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badminton_secret}
    # Unexposed publicly for production security; accessible via internal docker network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-badminton} -d ${POSTGRES_DB:-badminton_live}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - badminton-net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: badminton-live-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-badminton}:${POSTGRES_PASSWORD:-badminton_secret}@postgres:5432/${POSTGRES_DB:-badminton_live}?schema=public
      JWT_SECRET: ${JWT_SECRET:-prod_jwt_super_secret_key_badminton_live_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_jwt_refresh_secret_key_badminton_live_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - badminton-net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: badminton-live-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - badminton-net

networks:
  badminton-net:
    name: badminton-live-network
    driver: bridge

volumes:
  postgres_data:
    name: badminton-live-postgres-data
